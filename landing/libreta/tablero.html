<!--
  LIBRETA · TABLERO DEL SUPERVISOR (prototipo interactivo)
  Dearmas & Costantini · 01/10/2026

  Versión simple, con el alcance de los tableros de Rondín, Encargue y Tildalo: cinco secciones.
    #hoy   Hoy: quién está en la calle, rutas, pedidos de hoy, desvíos para responder y alertas.
    #vend  Vendedores: venta contra objetivo (con la raya de dónde deberían estar), ruta, pedidos,
           oportunidades y comisión. Tocá un vendedor para ver su ruta de hoy y sus clientes en riesgo.
    #suma  Lo que suma Libreta: oportunidades ofrecidas y vendidas, venta extra por tipo (estimada),
           clientes recuperados y lo vendido por sugerencias, mes a mes.
    #cli   Clientes: dejaron de comprar a su ritmo y deuda vencida. Tocá uno para ver su ficha.
    #ped   Pedidos: la bandeja de la app (Pendiente / En el sistema / Anulado) y la planilla para Doria.
  La versión anterior (réplica del portal «Comercial» del Business Hub, 18 pantallas) quedó en
  dashboard/anterior/Libreta_Dashboard_Hub_Comercial.html.

  Datos de ejemplo: Distribuidora Central (mayorista de consumo masivo, Montevideo),
  supervisora Laura, vendedores María Fernández (mf), Carlos Rodríguez (cr) y Lucía Méndez (lm).
  Todo se calcula desde los datos del script, así los números cierran entre secciones.
  Cuando está incrustado en un iframe no toca el historial ni el hash.

  ===================== CONTRATO DE MENSAJES (window.postMessage) =====================
  El tablero escucha mensajes del documento que lo incrusta (por ejemplo, la demo del celular
  en la landing). Se aceptan objetos con la propiedad «tipo»:

  1) Pedido nuevo que cargó un vendedor en la app
     { tipo: 'libreta-pedido',
       pedido: { n: 'P-2417',                 // número (si falta, se numera solo)
                 cli: 'robles',               // id del cliente (robles, familia, sarandi, buenavista,
                                              //   trattoria, pepe, pasaje, estrella…) o su nombre
                 ven: 'mf',                   // mf | cr | lm (por defecto mf)
                 hora: '11:32',               // opcional (por defecto la hora del tablero)
                 tot: 12880,                  // opcional: si falta, se suma de las líneas
                 lineas: [['LI-002', 6], ['BE-003', 4, true]],  // [código, cantidad, sugerido?]
                 nota: 'Entregar antes de las 11' } }            // opcional
     → entra a Pedidos como «Pendiente», suma al contador del menú, se resalta y avisa.
       Una línea es «sugerido» si viene marcada (tercer valor true) o si es un producto que la
       app le sugería a ese cliente. Si la parada está en la ruta de hoy, queda hecha con ese
       pedido, y las oportunidades de ese cliente con esos productos pasan a vendidas
       (suman en «Lo que suma Libreta»).

  2) Solicitud o desvío que mandó un vendedor
     { tipo: 'libreta-solicitud',
       sol: { id: 17,                          // opcional
              ven: 'mf',
              tipo: 'Desvío de ruta',          // o 'Visita fuera de ruta', 'Problema en una visita'…
              txt: 'Pide cambiar el orden…',
              hora: '11:40',                   // opcional
              est: 'pend' } }                  // 'pend' (espera aprobación) o 'info' (solo revisar)
     → entra a «Para decidir» en Hoy, suma al contador y se resalta.

  3) Ir a una sección: { tipo: 'libreta-ir', vista: 'ped' }
     'ped' → Pedidos · 'desv' → Hoy · también 'hoy', 'vend', 'suma', 'cli'.

  El tablero le avisa al documento que lo incrusta (window.parent.postMessage, solo si está en un iframe):
     { tipo: 'libreta-panel-listo' }                                      al cargar
     { tipo: 'libreta-solicitud-respuesta', id, est: 'aprobada'|'rechazada'|'revisada' }
     { tipo: 'libreta-pedido-estado', n, est: 'cargado'|'anulado'|'pendiente', comprobante?, motivo? }
     { tipo: 'libreta-tarea', ven, cli, txt }                             al pedir una visita o un cobro
  ====================================================================================
-->
<style>
:root{
  --blanco:#FFFFFF; --papel:#F4F5F8; --tinta:#10222A; --tinta-2:#44555C; --tinta-3:#74848A;
  --linea:#E1E5EA; --linea-2:#EDF0F3;
  --vereda:#0B6E7C; --vereda-600:#095C68; --vereda-50:#E7F3F5; --vereda-100:#CBE6EA; --vereda-clara:#8FD6DE;
  --aviso:#FF6A3D; --aviso-50:#FFF0EA; --aviso-tinta:#9A3412;
  --arena-50:#F5EEE2; --arena-tinta:#6B5428;
  --rojo:#C63A22; --rojo-50:#FCEAE6;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sombra-1:0 1px 2px rgba(16,34,42,.05);
  --sombra-2:0 1px 2px rgba(16,34,42,.04),0 10px 28px -18px rgba(16,34,42,.22);
  --sombra-3:0 2px 6px rgba(16,34,42,.08),0 30px 70px -30px rgba(16,34,42,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--tinta);background:var(--papel);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
a{color:var(--vereda)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
#main:focus{outline:none}
:focus-visible{outline:2px solid var(--vereda);outline-offset:2px;border-radius:8px}
::selection{background:var(--vereda-100)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.nw{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ armazón (como Rondín, Encargue y Tildalo) ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.lat{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--linea);padding:22px 16px 18px;display:flex;flex-direction:column;gap:20px;min-width:0;z-index:30}
.lat .logo{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.lat .logo > svg{width:96px;height:auto}
.menu{display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--tinta-2);font-weight:600;font-size:14px;text-align:left;white-space:nowrap}
.it:hover{background:var(--papel);color:var(--tinta)}
.it svg{width:18px;height:18px;flex:none}
.it span{overflow:hidden;text-overflow:ellipsis}
.it[aria-current="page"]{background:var(--vereda-50);color:var(--vereda)}
.cnt{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:500;font-style:normal;border-radius:999px;padding:1px 7px;min-width:22px;text-align:center;background:var(--papel);color:var(--tinta-2)}
.cnt.av-n{background:var(--aviso);color:#fff}
.empresa{margin-top:auto;border-top:1px solid var(--linea);padding-top:14px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--tinta);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.empresa b{display:block;font-size:13.5px;line-height:1.25}
.empresa small{display:block;font-size:12px;color:var(--tinta-3)}
.conexion{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tinta-2);background:var(--papel);border-radius:9px;padding:7px 10px}
.conexion i{width:7px;height:7px;border-radius:50%;background:var(--vereda);box-shadow:0 0 0 3px var(--vereda-50);flex:none}
.cerrar-lat{display:none}
.velo{display:none}

.pri{min-width:0;padding:22px 30px 34px;display:flex;flex-direction:column;gap:16px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 20px;min-height:58px}
.cab-izq{display:flex;align-items:center;gap:12px;min-width:0}
.cab h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.cab p{margin-top:4px;color:var(--tinta-2);font-size:14px}
.cab-der{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hamb{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--linea);background:#fff;place-items:center;flex:none;color:var(--tinta)}
.hamb svg{width:18px;height:18px}
.reloj{font-family:var(--mono);font-size:12.5px;color:var(--tinta-2);display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linea);border-radius:10px;height:38px;padding:0 12px;white-space:nowrap}
.reloj i{width:7px;height:7px;border-radius:50%;background:var(--vereda);box-shadow:0 0 0 3px var(--vereda-50)}
.periodo{height:38px;border:1px solid var(--linea);border-radius:10px;background:#fff;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--tinta-3)}
.periodo svg{width:16px;height:16px;flex:none}
.periodo select{border:0;outline:0;background:transparent;font-weight:600;font-size:13.5px;color:var(--tinta);padding-right:2px;cursor:pointer}
.contenido{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ============ piezas ============ */
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-2);padding:16px 18px;min-width:0}
.card.plano{box-shadow:none}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px;flex-wrap:wrap}
.ct h2{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ct span.s{font-size:12.5px;color:var(--tinta-3)}
.ct .link,.link{border:0;background:none;padding:0;font-size:13px;font-weight:700;color:var(--vereda)}
.link:hover{color:var(--vereda-600)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--aviso);box-shadow:0 0 0 3px rgba(255,106,61,.2);flex:none;display:inline-block}
.muted{color:var(--tinta-3)}
.baja{color:var(--rojo)}
.sube{color:var(--vereda)}
.fila{display:grid;gap:14px;min-width:0;align-items:start}
.f2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.f21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.f-hoy{grid-template-columns:minmax(0,1.42fr) minmax(0,1fr)}
.estira{align-items:stretch}
.nota{font-size:12.5px;color:var(--tinta-3);margin:0}
.nota b{color:var(--tinta-2)}
.lead{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.lead p{color:var(--tinta-2);font-size:13.5px;max-width:52rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--vereda);color:#fff}
.btn-p:hover{background:var(--vereda-600)}
.btn-s{background:#fff;color:var(--tinta);border-color:var(--linea)}
.btn-s:hover{border-color:#C6CED6}
.btn-g{background:none;color:var(--tinta-2);border-color:transparent}
.btn-g:hover{background:var(--papel);color:var(--tinta)}
.btn-r{background:var(--rojo);color:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:default}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;line-height:1.35}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ver{background:var(--vereda-50);color:var(--vereda)}
.chip.arena{background:var(--arena-50);color:var(--arena-tinta)}
.chip.rojo{background:var(--rojo-50);color:var(--rojo)}
.chip.nar{background:var(--aviso-50);color:var(--aviso-tinta)}
.chip.gris{background:var(--papel);color:var(--tinta-2)}
.chip.tinta{background:var(--tinta);color:#fff}
.chip.borde{background:#fff;color:var(--tinta-2);box-shadow:inset 0 0 0 1px var(--linea)}
.sug{font:500 10.5px var(--mono);background:var(--arena-50);color:var(--arena-tinta);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.tag{display:inline-flex;justify-content:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.cruzada{background:var(--vereda-50);color:var(--vereda)}
.tag.recompra{background:var(--arena-50);color:var(--arena-tinta)}
.tag.reactivar{background:var(--rojo-50);color:var(--rojo)}
.tag.cobrar{background:var(--aviso-50);color:var(--aviso-tinta)}
.tag.prospecto{background:var(--papel);color:var(--tinta-2)}

.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--linea);background:#fff;font-weight:600;font-size:13px;color:var(--tinta-2);white-space:nowrap}
.fc:hover{border-color:#C6CED6;color:var(--tinta)}
.fc i{font:500 11px var(--mono);font-style:normal;color:var(--tinta-3)}
.fc[aria-pressed="true"]{background:var(--vereda-50);border-color:var(--vereda-100);color:var(--vereda)}
.fc[aria-pressed="true"] i{color:var(--vereda)}
.fsep{width:1px;height:20px;background:var(--linea);margin:0 4px}
.campo{height:34px;border:1px solid var(--linea);border-radius:9px;background:#fff;padding:0 10px;font-size:13px;color:var(--tinta);min-width:0}
.campo:focus{outline:0;border-color:var(--vereda);box-shadow:0 0 0 3px var(--vereda-50)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k-hoy{grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-1);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi small{font-size:12.5px;color:var(--tinta-2);font-weight:600}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:12.5px;color:var(--tinta-3)}
.kpi em.bien{color:var(--vereda);font-weight:600}
.kpi em.mal{color:var(--rojo);font-weight:600}
.kpi.dest{background:var(--vereda);border-color:var(--vereda);color:#fff;box-shadow:0 16px 30px -22px rgba(11,110,124,.9)}
.kpi.dest small,.kpi.dest em{color:rgba(255,255,255,.86)}
.kpi.dest em.bien,.kpi.dest em.mal{color:#fff}
.kpi.grande b{font-size:30px}
.kpi .bb{height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin:8px 0 2px}
.kpi .bb i{display:block;height:100%;border-radius:4px;background:#fff}
.kpi .fd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
button.kpi{text-align:left;font:inherit;color:inherit;width:100%}
button.kpi:hover{border-color:#C6CED6}
button.kpi.dest:hover{background:var(--vereda-600)}

.meter{height:8px;border-radius:5px;background:var(--linea-2);overflow:visible;position:relative;min-width:60px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--vereda)}
.meter.bajo i{background:#B8914A}
.meter.mal i{background:var(--rojo)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--tinta);text-decoration:none}

/* barras */
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(90px,auto);gap:12px;align-items:center;padding:7px 0;font-size:13px}
.hb .p{height:12px;border-radius:4px;background:var(--linea-2);position:relative}
.hb .p i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--vereda)}
.hb .p i.b{background:var(--vereda-clara)}
.hb .p i.m{background:var(--rojo)}
.hb .p i.a{background:#B8914A}
.hb .p u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta);text-decoration:none}
.hb b{font-family:var(--mono);font-weight:500;font-size:12px;text-align:right;white-space:nowrap}
.ley{display:flex;gap:14px;font-size:12px;color:var(--tinta-3);margin-top:10px;flex-wrap:wrap}
.ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.graf{width:100%;height:auto;overflow:visible}
.graf .eje{font:400 10.5px var(--mono);fill:#74848A}
.graf .val{font:500 10.5px var(--mono);fill:#10222A}
.graf .bar:hover{opacity:.85}

.avt{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.avt.mf{background:var(--vereda)}
.avt.cr{background:var(--tinta)}
.avt.lm{background:#5E7F86}
.avt.gr{background:#9AA7AD}
.quien{display:flex;align-items:center;gap:10px;min-width:0}
.quien > span,.quien > div{min-width:0}
.quien b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--linea);background:#fff;display:grid;place-items:center;color:var(--tinta-2);flex:none}
.ib:hover{border-color:var(--vereda);color:var(--vereda)}
.ib svg{width:15px;height:15px}

/* tablas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font:500 10.5px var(--mono);color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);white-space:nowrap;background:#fff}
.t th.r,.t td.r{text-align:right}
.t th[data-sort]{cursor:pointer;user-select:none}
.t th[data-sort]:hover{color:var(--tinta)}
.t th .fl{display:inline-block;width:10px;color:var(--vereda)}
.t td{padding:9px 10px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.t td b{font-weight:600}
.t td small{display:block;font-size:12px;color:var(--tinta-3)}
.t tr.fk{cursor:pointer}
.t tr.fk:hover td{background:#FAFBFC}
.t tr.tot td{border-top:1px solid var(--linea);font-weight:700}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lnk:hover b,.lnk:hover{color:var(--vereda)}
.t td.nw{white-space:nowrap}
.pag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--tinta-3);flex-wrap:wrap}

/* listas */
.lis{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--linea-2)}
.li:first-child{border-top:0;padding-top:2px}
.li .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--tinta-3)}
.li .sev.pend{background:#B8914A}
.li .sev.prob{background:var(--rojo)}
.li .sev.ok{background:var(--vereda)}
.li b{font-weight:600;font-size:13.5px}
.li p{margin:2px 0 0;font-size:13px;color:var(--tinta-2)}
.li .tm{font-family:var(--mono);font-size:11.5px;color:var(--tinta-3)}
.li .bs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.li.nueva,.ped.nuevo,.prow.nuevo{animation:resalta 3s ease}
@keyframes resalta{0%,40%{background:var(--aviso-50)}100%{background:transparent}}

/* ============ Hoy ============ */
.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.calle-card{padding-bottom:12px}
.calle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.vcalle{display:flex;flex-direction:column;gap:10px;width:100%;border:0;border-left:1px solid var(--linea-2);background:none;text-align:left;padding:2px 18px 4px;min-width:0;border-radius:0}
.vcalle:first-child{border-left:0;padding-left:2px}
.vcalle:last-child{padding-right:2px}
.vcalle:hover .quien b{color:var(--vereda)}
.vcalle .arr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.vcalle .prog{display:flex;flex-direction:column;gap:5px}
.vcalle .prog span{font-size:12px;color:var(--tinta-3)}
.vcalle .prog span b{color:var(--tinta);font-weight:600}
.vcalle .ahora{font-size:13px;color:var(--tinta-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcalle .ahora b{font-weight:600;color:var(--tinta)}
.vcalle .vend{text-align:right;white-space:nowrap;flex:none}
.vcalle .vend b{display:block;font:500 13px var(--mono)}
.vcalle .vend small{font-size:12px;color:var(--tinta-3)}
.ap{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vereda);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 3px var(--vereda-50)}

.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--linea-2);background:none;text-align:left;padding:8px 2px}
.prow:first-child{border-top:0;padding-top:0}
.prow:hover b{color:var(--vereda)}
.prow .h{font:500 12px var(--mono);color:var(--tinta-3)}
.prow b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .der{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prow .m{font:500 12.5px var(--mono);white-space:nowrap}
.prow .chip{font-size:11px;padding:2px 8px}

.alertas{display:flex;flex-direction:column;gap:8px}
.alerta{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;width:100%;border:1px solid var(--linea);border-radius:12px;background:#fff;text-align:left;padding:10px 12px}
.alerta:hover{border-color:#C6CED6}
.alerta .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.alerta .ic svg{width:16px;height:16px}
.alerta .ic.rojo{background:var(--rojo-50);color:var(--rojo)}
.alerta .ic.arena{background:var(--arena-50);color:var(--arena-tinta)}
.alerta .ic.nar{background:var(--aviso-50);color:var(--aviso-tinta)}
.alerta .ic.ver{background:var(--vereda-50);color:var(--vereda)}
.alerta b{display:block;font-size:13.5px;font-weight:600}
.alerta small{display:block;font-size:12.5px;color:var(--tinta-3);line-height:1.4}

/* ============ Vendedores ============ */
.vlista{display:flex;flex-direction:column;gap:10px}
.vcols,.vrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.9fr) minmax(0,.85fr) minmax(0,.85fr) minmax(0,.95fr) minmax(0,.9fr) 18px;gap:18px;align-items:center}
.vcols{padding:0 18px;font:500 10.5px var(--mono);color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em}
.vrow{width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-2);padding:16px 18px}
.vrow:hover{border-color:#C6CED6}
.vrow:hover .quien b{color:var(--vereda)}
.vrow .avt{width:36px;height:36px;font-size:12.5px}
.vrow .c b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .c small{display:block;font-size:12px;color:var(--tinta-3);white-space:nowrap}
.vrow .obj{display:flex;flex-direction:column;gap:7px}
.vrow .obj .oh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vrow .obj .oh b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.vrow .obj .oh span{font-size:12.5px;color:var(--tinta-3)}
.vrow .obj .oh em{margin-left:auto;font-style:normal;font:500 12.5px var(--mono)}
.vrow .chev{color:var(--tinta-3)}
.vrow .chev svg{width:16px;height:16px}
.vrow .lbl-m{display:none}

/* ============ Lo que suma ============ */
.mam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:230px;padding:22px 4px 0;border-bottom:1px solid var(--linea)}
.mam-c{display:flex;flex-direction:column;min-width:0}
.mam-b{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:12px;background:linear-gradient(var(--linea-2),var(--linea-2)) 0 33%/100% 1px no-repeat,linear-gradient(var(--linea-2),var(--linea-2)) 0 66%/100% 1px no-repeat}
.mam-b span{position:relative;width:min(30px,36%);border-radius:5px 5px 0 0;min-height:2px}
.mam-b .b1{background:#5E9AA3}
.mam-b .b2{background:var(--vereda-clara)}
.mam-c.hl .b1{background:var(--vereda)}
.mam-b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font:500 10px var(--mono);font-style:normal;color:var(--tinta-2);white-space:nowrap}
.mam-c.hl em{color:var(--tinta)}
.mam-c small{text-align:center;font:400 11px var(--mono);color:var(--tinta-3);padding:6px 0 0;margin-bottom:-24px}
.mam-c.hl small{color:var(--tinta);font-weight:500}
.mam + .ley{margin-top:30px}
.mini-m{display:flex;align-items:center;gap:8px;min-width:120px}
.mini-m .meter{flex:1;min-width:50px}
.mini-m span{font:500 12px var(--mono);width:36px;text-align:right}
.como{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.como li{font-size:13px;color:var(--tinta-2);padding-left:14px;position:relative}
.como li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--vereda-clara)}
.como li b{color:var(--tinta)}
.est{font:500 10.5px var(--mono);color:var(--tinta-3);border:1px solid var(--linea);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;letter-spacing:.02em}
.kpi.dest .est{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.35)}

/* pedidos (bandeja como en la app) */
.peds{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.ped{background:#fff;border:1px solid var(--linea);border-radius:13px;box-shadow:var(--sombra-1)}
.ped-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:12px 16px;text-align:left;flex-wrap:wrap}
.ped-h .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.ped-h .l span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.ped-h .l .n{font:500 12.5px var(--mono);color:var(--tinta-3)}
.ped-h .l small{font-size:12px;color:var(--tinta-3)}
.ped-h .tot{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ped-b{border-top:1px solid var(--linea-2);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.ped-nota{background:var(--papel);border-radius:9px;padding:8px 11px;font-size:12.5px}
.ped-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ped-in{display:flex;gap:8px;flex-wrap:wrap}
.ped-in .campo{flex:1;min-width:200px;height:36px}

/* ruta (timeline) */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:46px 22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--linea-2)}
.tl-i:first-child{border-top:0}
.tl-i .h{font:500 12px var(--mono);color:var(--tinta-3);padding-top:2px}
.tl-i .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);background:var(--papel);color:var(--tinta-2);border:1px solid var(--linea);position:relative}
.tl-i .d.hecha{background:var(--vereda);color:#fff;border-color:var(--vereda)}
.tl-i .d.visita{background:#fff;color:var(--vereda);border:2px solid var(--vereda)}
.tl-i .d.prob{background:var(--rojo-50);color:var(--rojo);border-color:var(--rojo-50)}
.tl-i .d .op{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--aviso);border:1.5px solid #fff}
.tl-i b{font-weight:600;font-size:13.5px}
.tl-i small{display:block;font-size:12px;color:var(--tinta-3)}

/* ficha (panel lateral) */
.velo-f{position:fixed;inset:0;background:rgba(16,34,42,.32);z-index:60}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--papel);z-index:61;display:flex;flex-direction:column;box-shadow:var(--sombra-3);animation:entra .2s ease}
@keyframes entra{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.fi-h{background:#fff;border-bottom:1px solid var(--linea);padding:16px 18px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.fi-h .av,.fi-h .avt{width:40px;height:40px;font-size:13px}
.fi-h small{display:block;font-size:12px;color:var(--tinta-3)}
.fi-h h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.fi-b{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.fi-b .kpi b{font-size:19px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--linea);background:#fff;display:grid;place-items:center;color:var(--tinta-2)}
.x svg{width:16px;height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facs{display:flex;flex-direction:column}
.facs div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--linea-2);font-size:13px}
.facs div:first-child{border-top:0;padding-top:0}
.facs .mono{font-size:12px;color:var(--tinta-2)}
.facs b{font:500 12.5px var(--mono);text-align:right}

/* toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--tinta);color:#fff;border-radius:12px;padding:10px 12px 10px 14px;font-size:13.5px;display:flex;align-items:center;gap:12px;box-shadow:var(--sombra-3);animation:sube .2s ease}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;height:28px;padding:0 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ responsive ============ */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.k-hoy{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.k-hoy .grande{grid-column:span 3}
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-hoy,.f21{grid-template-columns:minmax(0,1fr)}
  .f3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .f3 > :last-child{grid-column:1/-1}
  .vcols{display:none}
  .vrow{grid-template-columns:repeat(4,minmax(0,1fr)) 18px;gap:12px 18px}
  .vrow .quien{grid-column:1/3}
  .vrow .obj{grid-column:3/5}
  .vrow .chev{grid-column:5;grid-row:1}
  .vrow .lbl-m{display:block;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-3);margin-bottom:2px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lat{position:fixed;left:0;top:0;bottom:0;width:272px;height:100%;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--sombra-3)}
  body.menu-abierto .lat{transform:none}
  body.menu-abierto .velo{display:block;position:fixed;inset:0;background:rgba(16,34,42,.32);z-index:25}
  .cerrar-lat{display:grid;width:34px;height:34px;border-radius:9px;border:1px solid var(--linea);background:#fff;place-items:center;color:var(--tinta-2)}
  .cerrar-lat svg{width:15px;height:15px}
  .hamb{display:grid}
  .f2,.f3{grid-template-columns:minmax(0,1fr)}
  .calle{grid-template-columns:minmax(0,1fr)}
  .vcalle{border-left:0;border-top:1px solid var(--linea-2);padding:12px 2px}
  .vcalle:first-child{border-top:0;padding-top:2px}
}
@media (max-width:760px){
  .pri{padding:14px 16px 90px;gap:14px}
  .cab{flex-direction:column;align-items:stretch;gap:10px;min-height:0}
  .cab h1{font-size:21px}
  .cab p{font-size:13px}
  .cab-der:empty{display:none}
  .kpis,.kpis.k3,.kpis.k4,.kpis.k-hoy{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis.k-hoy .grande{grid-column:1/-1}
  .kpis:not(.k3):not(.k4):not(.k-hoy) > .dest:first-child{grid-column:1/-1}
  .kpi{padding:12px}
  .kpi b{font-size:19px}
  .kpi.grande b{font-size:26px}
  .card{padding:14px}
  .vcalle .ahora{white-space:normal}
  .mam{gap:8px}
  .vrow{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
  .vrow .quien,.vrow .obj{grid-column:1/-1}
  .vrow .chev{display:none}
  .vrow .c b{font-size:15px}
  .hb{grid-template-columns:84px minmax(0,1fr) auto;gap:8px}
  .tl-i{grid-template-columns:42px 22px minmax(0,1fr)}
  .tl-i > :last-child{grid-column:3}
  .ped-b .t th:nth-child(4),.ped-b .t td:nth-child(4){display:none}
  .ped-h{padding:12px 14px}
  .ped-b{padding:10px 12px 12px}
  .ped-in .campo{min-width:0;flex-basis:100%}
}

/* ============ asesor (consultor comercial, como en la app) ============ */
.ase-btn{position:fixed;right:22px;bottom:22px;z-index:70;width:54px;height:54px;border-radius:50%;border:0;background:var(--aviso);color:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -12px rgba(255,106,61,.9);padding:0}
.ase-btn:hover{filter:brightness(1.05)}
.ase-btn svg{width:24px;height:24px}
.ase-btn i{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#1B9A5A;box-shadow:0 0 0 2.5px #fff}
body.ase-abierto .ase-btn{display:none}
.ase{position:fixed;top:0;right:0;bottom:0;z-index:72;width:min(420px,100%);background:#fff;border-left:1px solid var(--linea);box-shadow:var(--sombra-3);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
body.ase-abierto .ase{transform:none;visibility:visible}
.ase-cab{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linea);background:var(--papel)}
.ase-cab .av{width:34px;height:34px;border-radius:50%;background:var(--aviso);color:#fff;display:grid;place-items:center;flex:none}
.ase-cab .av svg{width:18px;height:18px}
.ase-cab div{flex:1;min-width:0}
.ase-cab b{display:block;font-size:14px}
.ase-cab small{display:block;font-size:12px;color:var(--tinta-3)}
.ase-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.am{max-width:92%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.5;animation:sube .2s ease}
.am.ia{align-self:flex-start;background:var(--papel);border-bottom-left-radius:4px}
.am.yo{align-self:flex-end;background:var(--vereda);color:#fff;border-bottom-right-radius:4px}
.am ul{margin:6px 0 2px;padding-left:18px}
.am li{margin:2px 0}
.am .et{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-3);margin-top:6px}
.am .pausa{display:inline-flex;gap:3px}
.am .pausa i{width:6px;height:6px;border-radius:50%;background:var(--tinta-3);animation:late 1s infinite}
@keyframes late{50%{opacity:.25}}
.am .pausa i:nth-child(2){animation-delay:.15s}.am .pausa i:nth-child(3){animation-delay:.3s}
.ase-ir{display:inline-flex;margin-top:8px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12.5px;color:var(--vereda)}
.ase-ir:hover{border-color:var(--vereda)}
.ase-acc{margin-top:9px;border:1px solid var(--aviso);background:#fff;border-radius:12px;padding:9px 11px}
.ase-acc small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--aviso-tinta);margin-bottom:3px}
.ase-acc p{margin:0 0 8px;font-size:13px}
.ase-acc div{display:flex;gap:6px}
.ase-sug{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px}
.ase-sug button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--tinta-2);text-align:left}
.ase-sug button:hover{border-color:var(--aviso);color:var(--tinta)}
.ase-in{flex:none;display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--linea)}
.ase-in input{flex:1;min-width:0;height:42px;border:1px solid var(--linea);border-radius:12px;padding:0 12px;font-size:14px;background:var(--papel)}
.ase-in input:focus{outline:0;border-color:var(--aviso);background:#fff}
.ase-in button{width:42px;height:42px;border-radius:12px;border:0;background:var(--vereda);color:#fff;display:grid;place-items:center;flex:none}
.ase-in button svg{width:17px;height:17px}
@media (max-width:760px){.ase{width:100%}.ase-btn{right:16px;bottom:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="lat" id="lat" aria-label="Menú">
    <div class="logo">
      <svg viewBox="0 6 398 100" role="img" aria-label="Libreta"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M40 44V100M68 14V100M68 72A28 28 0 1 0 124 72A28 28 0 1 0 68 72M150 100V44M150 72A28 28 0 0 1 178 44M202 72H258A28 28 0 1 0 252.7 88.5M290 31.2V83A17 17 0 0 0 307 100M278 44H305M386 72A28 28 0 1 0 330 72A28 28 0 1 0 386 72M386 44V100" stroke="#10222A" stroke-width="11"/><path d="M12 14V100" stroke="#0B6E7C" stroke-width="11"/></g><circle cx="40" cy="22" r="9" fill="#FF6A3D"/></svg>
      <button type="button" class="cerrar-lat" data-a="menuCerrar" aria-label="Cerrar el menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="menu" id="menu" aria-label="Secciones"></nav>
    <div class="empresa">
      <span class="av">DC</span><div><b>Distribuidora Central</b><small>Laura · Supervisora</small></div>
      <div class="conexion"><i></i><span id="sync">Conectado a Doria · 10:20</span></div>
    </div>
  </aside>
  <div class="velo" data-a="menuCerrar"></div>
  <div class="pri">

  if (/margen|precio/.test(t)){
    var bj = CATALOGO.filter(function(p){ return (p.p - p.k) / p.p < .16; });
    r.txt = 'El margen promedio de la lista es ' + Math.round(suma(CATALOGO, function(p){ return (p.p - p.k) / p.p; }) / CATALOGO.length * 100) + ' %. ' + (bj.length ? 'Con menos de 16 %:<ul>' + bj.map(function(p){ return '<li>' + esc(p.d) + ': lista ' + $u(p.p) + ', costo ' + $u(p.k) + ' (' + Math.round((p.p - p.k) / p.p * 100) + ' %). Para volver a 20 %: ' + $u(Math.ceil(p.k / .8)) + '.</li>'; }).join('') + '</ul>' : 'Ningún producto está por debajo de 16 %.');
    return r;
  }
  if (/comision/.test(t)){
    r.txt = 'Comisiones estimadas de setiembre:<ul>' + VEND.map(function(v){ return '<li><b>' + v.nom + '</b>: ' + $u(v.mes[11] * v.com) + ' (' + Math.round(v.com * 100) + ' % de ' + $u(v.mes[11]) + ')</li>'; }).join('') + '</ul>Total: ' + $u(suma(VEND, function(v){ return v.mes[11] * v.com; })) + '.';
    r.ir = ['Abrir Vendedores', 'vend'];
    return r;
  }
  if (/ruta|en la calle|visitas de hoy|como van hoy/.test(t) && !ven){
    r.txt = 'Hoy, a las ' + S.hora + ':<ul>' + VEND.map(function(v){ var e = rutaInfo(v.id); return '<li><b>' + v.corto + '</b>: ' + e.hechas + ' de ' + e.total + ' visitas' + (e.act ? ', en visita en ' + esc(nombreCli(e.act.c)) : e.prox ? ', próxima ' + esc(nombreCli(e.prox.c)) + ' a las ' + e.prox.h : '') + '. ' + pedidosHoy(v.id).length + ' pedidos.</li>'; }).join('') + '</ul>';
    r.ir = ['Abrir Hoy', 'hoy'];
    return r;
  }
  if (/brief|como viene|resumen de|contame de/.test(t) && ven){
    var v = VX[ven], i = 11, p = pc(v.mes[i], v.obj.set), e = estadoRuta(ven), rs = riesgo(ven), vv = vencidos(ven), ph = pedidosHoy(ven);
    r.txt = '<span class="et">Diagnóstico</span><b>' + v.nom + '</b> va ' + $u(v.mes[i]) + ', el <b>' + p + ' %</b> de su objetivo de ' + $u(v.obj.set) + '. Hoy hizo ' + e.hechas + ' de ' + e.total + ' visitas y cargó ' + ph.length + ' pedidos por ' + $u(suma(ph, function(x){ return x.tot; })) + '.' +
      '<span class="et">Comparación</span>Contra setiembre 2025: ' + (pc(v.mes[i], v.ly.set) - 100 >= 0 ? '+' : '') + (pc(v.mes[i], v.ly.set) - 100) + ' %. Ruta del mes cumplida en ' + pc(v.vis.set[0], v.vis.set[1]) + ' %. Tiene ' + rs.length + ' clientes en riesgo y ' + $u(suma(vv, function(x){ return x.ven; })) + ' vencidos.' +
      '<span class="et">Recomendación</span>' + (rs.length ? 'Que priorice a <b>' + esc(rs.sort(function(a, b){ return b.m - a.m; })[0].n) + '</b>, el cliente en riesgo que más pesa' : 'Que sume visitas de prospección') + (p < 85 ? ', y revisá con ' + v.corto + ' la ruta del jueves: viene ' + (97 - p) + ' puntos abajo del ritmo.' : '.');
    r.sug = ['¿Qué clientes de ' + v.corto + ' no compran hace más de 30 días?', 'Pedile a ' + v.corto + ' que pase por ' + (rs[0] ? rs[0].n : 'su cliente más grande')];
    r.ir = ['Ver la ruta de hoy de ' + v.corto, 'vendedor', v.id];
    return r;
  }
  if (/objetivo|vamos|venimos|falta|meta|cierra/.test(t)){
    var p2 = pc(M.venta, M.obj), proy = pc(M.venta / 29 * 30, M.obj);
    var orden = VEND.slice().sort(function(a, b){ return pc(a.mes[11], a.obj.set) - pc(b.mes[11], b.obj.set); });
    r.txt = '<span class="et">Diagnóstico</span>Setiembre va en <b>' + $u(M.venta) + '</b>, el <b>' + p2 + ' %</b> del objetivo de ' + $u(M.obj) + '. Faltan ' + $u(Math.max(0, M.obj - M.venta)) + ' y al ritmo de hoy el mes cierra en ' + proy + ' %.' +
      '<span class="et">Comparación</span>Contra setiembre 2025, ' + (pc(M.venta, M.ly) - 100) + ' % arriba. Por vendedor: ' + VEND.map(function(v){ return v.corto + ' ' + pc(v.mes[11], v.obj.set) + ' %'; }).join(', ') + '.' +
      '<span class="et">Recomendación</span>Lo que más mueve la aguja es <b>' + orden[0].nom + '</b> (' + pc(orden[0].mes[11], orden[0].obj.set) + ' %): tiene ' + riesgo(orden[0].id).length + ' clientes en riesgo para reactivar esta semana.';
    r.sug = ['Dame un brief de ' + orden[0].corto, '¿Qué clientes están más en riesgo?'];
    r.ir = ['Abrir Vendedores', 'vend'];
    return r;
  }
  if (/vendio mas|ranking|mejor vendedor|quien vend/.test(t)){
    var rk = VEND.slice().sort(function(a, b){ return b.mes[11] - a.mes[11]; });
    r.txt = 'En setiembre:<ul>' + rk.map(function(v){ return '<li><b>' + v.nom + '</b>: ' + $u(v.mes[11]) + ' (' + pc(v.mes[11], v.obj.set) + ' % de su objetivo)</li>'; }).join('') + '</ul>Contra el objetivo, el que mejor viene es ' + VEND.slice().sort(function(a, b){ return pc(b.mes[11], b.obj.set) - pc(a.mes[11], a.obj.set); })[0].corto + '.';
    r.ir = ['Abrir Vendedores', 'vend'];
    return r;
  }
  if (/riesgo|no compra|dejaron de comprar|dejo de comprar|30 dias/.test(t) && !/debe|vencid/.test(t)){
    var L = riesgo(ven).sort(function(a, b){ return b.m - a.m; });
    r.txt = (ven ? VX[ven].corto + ' tiene' : 'Hay') + ' <b>' + L.length + ' clientes</b> que dejaron de comprar a su ritmo, ' + $u(suma(L, function(x){ return x.m; })) + ' por mes en juego. Los que más pesan:<ul>' + L.slice(0, 5).map(function(x){ return '<li><b>' + esc(x.n) + '</b> (' + esc(corV(x.v)) + '): ' + x.u + ' días sin comprar; antes ' + $u(x.m) + '/mes.</li>'; }).join('') + '</ul>Recomendación: pedí visita para los dos primeros esta semana.';
    if (L[0]) r.sug = ['Pedile a ' + corV(L[0].v) + ' que pase por ' + L[0].n, '¿Quién debe más de 30 días?'];
    r.ir = ['Abrir Clientes', 'cli'];
    return r;
  }
  if (/debe|vencid|cobr|deuda/.test(t)){
    var D = vencidos(ven || 'todos').filter(function(x){ return /30/.test(t) ? x.dv > 30 : true; }).sort(function(a, b){ return b.ven - a.ven; });
    r.txt = D.length ? '<b>' + $u(suma(D, function(x){ return x.ven; })) + '</b> vencidos en ' + D.length + ' clientes:<ul>' + D.slice(0, 6).map(function(x){ return '<li><b>' + esc(x.n) + '</b> (' + esc(corV(x.v)) + '): ' + $u(x.ven) + ', ' + x.dv + ' días.</li>'; }).join('') + '</ul>Los de más de 30 días tienen los pedidos bloqueados hasta pagar.' : 'No hay deuda vencida con ese filtro.';
    r.sug = ['¿Qué clientes están más en riesgo?'];
    r.ir = ['Abrir Clientes', 'cli'];
    return r;
  }
  if (/oportunidad|ofrecer|semana/.test(t)){
    var O = OPS.filter(function(o){ return !o.est && !o.off && (!ven || o.w === ven); }).sort(function(a, b){ return b.v - a.v; });
    r.txt = 'Las que más plata mueven:<ul>' + O.slice(0, 5).map(function(o){ return '<li><b>' + esc(o.a + ' ' + (o.c ? nombreCli(o.c) : o.n)) + '</b> (' + esc(corV(o.w)) + ', ≈ ' + $m(o.v) + '/mes): ' + esc(o.why) + '</li>'; }).join('') + '</ul>';
    r.ir = ['Ver lo que suma Libreta', 'suma'];
    return r;
  }
  if (c){
    r.txt = '<b>' + esc(c.n) + '</b> (' + esc(c.r) + ', ' + esc(c.z) + ', cartera de ' + esc(corV(c.v)) + '): compra ' + $u(c.m) + ' por mes, cada ' + c.f + ' días; la última fue ' + hace(c.u).toLowerCase() + '. Saldo ' + (c.sal ? $u(c.sal) + (c.ven ? ', ' + $u(c.ven) + ' vencido' : '') : 'al día') + '.' + (c.est === 'riesgo' ? ' Está en riesgo.' : '');
    r.sug = ['Pedile a ' + corV(c.v) + ' que pase por ' + c.n];
    r.ir = ['Ver la ficha', 'ficha', c.id];
    return r;
  }
  r.txt = 'Puedo contarte cómo vienen las ventas y cada vendedor, quién dejó de comprar, quién debe, qué pedidos faltan cargar y cuánto suma Libreta. También te respondo por familias, productos, ofertas, presupuestos, prospectos, márgenes y comisiones. Y puedo pedir una visita, marcar un pedido como cargado, aprobar un desvío o bajarte una planilla, siempre con tu confirmación.';
  r.sug = ASE_SUG.slice(0, 3);
  return r;
}
function aseMsg(cls, html){ var d = document.createElement('div'); d.className = 'am ' + cls; d.innerHTML = html; var m = $('ase-msgs'); m.appendChild(d); m.scrollTop = m.scrollHeight; return d; }
function aseSug(l){ $('ase-sug').innerHTML = l.slice(0, 3).map(function(x){ return '<button type="button" data-ase-q="' + esc(x) + '">' + esc(x) + '</button>'; }).join(''); }
function aseAbrir(){
  ASE.abierto = true; document.body.classList.add('ase-abierto');
  if (!ASE.saludo){ ASE.saludo = true; var M = metricas('set'); aseMsg('ia', 'Hola, Laura. Setiembre va en <b>' + $u(M.venta) + '</b> (' + pc(M.venta, M.obj) + ' % del objetivo), hay <b>' + pendientes().length + ' pedidos</b> por cargar y <b>' + SOL.filter(function(s){ return s.est === 'pend'; }).length + ' desvíos</b> esperando tu respuesta. Preguntame lo que necesites o pedime una acción: la propongo y la hago cuando confirmes.'); aseSug(ASE_SUG); }
  setTimeout(function(){ $('ase-txt').focus({preventScroll: true}); }, 250);
}
function aseCerrar(){ ASE.abierto = false; document.body.classList.remove('ase-abierto'); }
function asePreguntar(texto){
  texto = String(texto || '').trim(); if (!texto) return;
  aseMsg('yo', esc(texto)); $('ase-txt').value = ''; $('ase-sug').innerHTML = '';
  var d = aseMsg('ia', '<span class="pausa"><i></i><i></i><i></i></span>'), r = aseRespuesta(texto);
  setTimeout(function(){
    d.innerHTML = r.txt;
    if (r.ir){ var bi = document.createElement('button'); bi.type = 'button'; bi.className = 'ase-ir'; bi.setAttribute('data-ase-ir', r.ir[1]); if (r.ir[2]) bi.setAttribute('data-ase-id', r.ir[2]); bi.textContent = r.ir[0] + ' →'; d.appendChild(document.createElement('br')); d.appendChild(bi); }
    if (r.acc){
      var aid = ++ASE.n; ASE.acciones[aid] = r.acc;
      document.querySelectorAll('#ase-msgs .ase-acc button').forEach(function(b){ b.disabled = true; });
      var box = document.createElement('div'); box.className = 'ase-acc'; box.setAttribute('data-aid', aid);
      box.innerHTML = '<small>Propuesta · ¿Confirmás?</small><p>' + esc(r.acc.txt) + '</p><div><button type="button" class="btn btn-p btn-sm" data-ase-conf="si">Confirmar</button><button type="button" class="btn btn-s btn-sm" data-ase-conf="no">Cancelar</button></div>';
      d.appendChild(box);
    }
    aseSug(r.sug.length ? r.sug : ASE_SUG);
    var m = $('ase-msgs'); m.scrollTop = m.scrollHeight;
  }, 600);
}
$('ase-btn').addEventListener('click', aseAbrir);
$('ase-cerrar').addEventListener('click', aseCerrar);
$('ase-form').addEventListener('submit', function(e){ e.preventDefault(); e.stopPropagation(); asePreguntar($('ase-txt').value); });
$('ase').addEventListener('click', function(e){
  e.stopPropagation();
  var q = e.target.closest('[data-ase-q]'); if (q){ asePreguntar(q.getAttribute('data-ase-q')); return; }
  var g = e.target.closest('[data-ase-ir]');
  if (g){
    var k = g.getAttribute('data-ase-ir'), gid = g.getAttribute('data-ase-id');
    if (window.innerWidth < 900) aseCerrar();
    if (k === 'ficha') abrirFicha(gid); else if (k === 'vendedor') abrirVend(gid); else { cerrarCapa(); ir(k); }
    return;
  }
  var c = e.target.closest('[data-ase-conf]'); if (!c) return;
  var box = c.closest('.ase-acc'); box.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
  var aid = box.getAttribute('data-aid'), acc = ASE.acciones[aid]; delete ASE.acciones[aid];
  if (c.getAttribute('data-ase-conf') === 'si' && acc){ aseMsg('yo', 'Confirmar'); aseMsg('ia', esc(acc.hacer())); }
  else { aseMsg('yo', 'Cancelar'); aseMsg('ia', 'No hice nada. La acción quedó sin hacer.'); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && ASE.abierto) aseCerrar(); });

/* ================================ mensajes desde la demo del celular ================================ */
function recibirPedido(d){
  if (!d || typeof d !== 'object') return;
  var cliId = CX[d.cli] ? d.cli : (CLIENTES.find(function(c){ return sinT(c.n) === sinT(d.cli || ''); }) || {}).id;
  var ven = VX[d.ven] ? d.ven : (cliId ? CX[cliId].v : 'mf');
  var num = typeof d.n === 'string' && /^[\w-]{1,20}$/.test(d.n) ? d.n : 'P-' + N_PED;
  if (PEDIDOS.some(function(p){ return p.n === num; })) return;
  var m = /^P-(\d+)$/.exec(num); if (m && +m[1] >= N_PED) N_PED = +m[1] + 1;
  var sugCli = cliId ? CX[cliId].sug : [], ops = OPS.filter(function(o){ return o.c === cliId; });
  var lin = (Array.isArray(d.lineas) ? d.lineas : []).filter(function(l){ return Array.isArray(l) && l.length >= 2 && +l[1] > 0; }).slice(0, 80).map(function(l){
    var p = PROD[l[0]] || {c: String(l[0]).slice(0, 20), d: String(l[0]).slice(0, 60), p: 0}, q = Math.round(+l[1]);
    var sug = l[2] === true || sugCli.indexOf(p.c) >= 0 || ops.some(function(o){ return (o.cods || []).indexOf(p.c) >= 0; });
    return {c: p.c, d: p.d, q: q, p: p.p, imp: p.p * q, sug: sug};
  });
  var tot = typeof d.tot === 'number' && d.tot > 0 ? Math.round(d.tot) : suma(lin, function(l){ return l.imp; });
  var hora = typeof d.hora === 'string' && /^\d{1,2}:\d{2}$/.test(d.hora) ? d.hora : S.hora;
  var ped = {n: num, cli: cliId || String(d.cli || 'Cliente').slice(0, 60), ven: ven, f: '29/09', hora: hora, est: 'pend', lin: lin, tot: tot, nota: typeof d.nota === 'string' ? d.nota.slice(0, 200) : '', demo: true};
  PEDIDOS.unshift(ped);
  if (cliId){
    var c = CX[cliId]; c.u = 0;
    RUTAS[ven].forEach(function(s){ if (s.c === cliId && s.est !== 'hecha'){ s.est = 'hecha'; s.lle = s.lle || hora; s.ped = num; } });
    OPS.forEach(function(o){ if (o.c === cliId && !o.est && !o.off && (o.cods || []).some(function(cd){ return lin.some(function(l){ return l.c === cd; }); })){
      o.est = 'vendida'; o.ped = num; S.extraConc++;
      S.vendHoy.push({t: o.t, ven: o.w, ped: num, imp: suma(lin.filter(function(l){ return (o.cods || []).indexOf(l.c) >= 0; }), function(l){ return l.imp; })});
    } });
  }
  S.pedOpen[num] = true; marcarNuevo(num);
  toast('Pedido nuevo de ' + corV(ven) + ': ' + num + ' · ' + (cliId ? CX[cliId].n : ped.cli) + ' · ' + $u(tot), S.v === 'ped' ? null : 'Ver', function(){ S.pedV = 'pend'; S.pedVen = 'todos'; ir('ped'); });
  if (S.v === 'ped'){ S.pedV = S.pedV === 'todos' ? 'todos' : 'pend'; }
  render(true);
}
function recibirSolicitud(d){
  if (!d || typeof d !== 'object' || !d.txt) return;
  var id = typeof d.id === 'number' && !SOL.some(function(s){ return s.id === d.id; }) ? d.id : Date.now();
  var s = {id: id, ven: VX[d.ven] ? d.ven : 'mf', tipo: String(d.tipo || 'Solicitud').slice(0, 60), txt: String(d.txt).slice(0, 300), hora: typeof d.hora === 'string' && /^\d{1,2}:\d{2}$/.test(d.hora) ? d.hora : S.hora, f: 'hoy', est: d.est === 'info' ? 'info' : 'pend', cli: CX[d.cli] ? d.cli : null};
  SOL.unshift(s); marcarNuevo('sol' + s.id);
  toast(s.tipo + ' de ' + corV(s.ven) + (s.est === 'pend' ? ': espera tu respuesta.' : ': para revisar.'), S.v === 'hoy' ? null : 'Ver', function(){ ir('hoy'); });
  render(true);
}
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.tipo === 'libreta-pedido') recibirPedido(d.pedido);
  else if (d.tipo === 'libreta-solicitud') recibirSolicitud(d.sol);
  else if (d.tipo === 'libreta-ir' && typeof d.vista === 'string' && (R[d.vista] || ALIAS[d.vista])){ cerrarCapa(); ir(d.vista); }
});

/* reloj del tablero: avanza de a un minuto */
setInterval(function(){
  var m = aMin(S.hora) + 1; S.hora = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  $('sync').textContent = 'Conectado a Doria · ' + S.hora;
  var r = $('reloj-h'); if (r) r.textContent = S.hora;
}, 60000);

/* arranque */
(function(){
  var h = (location.hash || '').slice(1);
  h = ALIAS[h] || h;
  if (R[h]) S.v = h;
  $('sync').textContent = 'Conectado a Doria · ' + S.hora;
  render();
  avisarPadre({tipo: 'libreta-panel-listo'});
})();
})();
</script>
