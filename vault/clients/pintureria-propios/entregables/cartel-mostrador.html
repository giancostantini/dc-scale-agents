<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pinturería Propios — cartel de mostrador (A6)</title>
<!--
  CARTEL DE MOSTRADOR — Pinturería Propios
  Pieza A6 vertical: 100 x 150 mm + 3 mm de sangrado por lado = 106 x 156 mm.

  Para exportar el PDF de imprenta:
    Chrome -> Imprimir -> Destino "Guardar como PDF"
    -> Márgenes: Ninguno
    -> Tamaño: Personalizado 106 x 156 mm (o A6 y recortar)
    -> Gráficos de fondo: ACTIVADO   <- si no, salen los colores en blanco
  Sale vectorial, con las fuentes embebidas.

  El QR va inline como SVG (vector). NO reemplazarlo por una captura de pantalla
  ni reescalarlo a menos de 40 mm: a menos de 3 cm empieza a fallar el escaneo
  desde la distancia real de un mostrador.

  El logo es un placeholder hasta que llegue el vector. Reemplazar el bloque
  .logo-slot por <img src="logo.svg"> manteniendo la altura de 18 mm.
-->
<style>
  /* Paleta tomada del logo actual (perfil de Instagram @pintureriapropios).
     Confirmar contra el vector original cuando lo mande el cliente. */
  :root {
    --azul:     #123A8F;
    --amarillo: #FFD100;
    --rojo:     #D81E05;
    --tinta:    #111111;
    --gris:     #5A5A5A;

    --ancho-final: 100mm;
    --alto-final:  150mm;
    --sangrado:    3mm;
  }

  @page {
    size: 106mm 156mm;
    margin: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #E8E8E8;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .pieza {
    position: relative;
    width: calc(var(--ancho-final) + var(--sangrado) * 2);
    height: calc(var(--alto-final) + var(--sangrado) * 2);
    margin: 10mm auto;
    background: #FFFFFF;
    overflow: hidden;
  }

  @media print {
    html, body { background: #FFFFFF; }
    .pieza { margin: 0; }
    .marcas { display: block; }
  }

  /* Contenido, ya dentro de la línea de corte */
  .contenido {
    position: absolute;
    top: var(--sangrado);
    left: var(--sangrado);
    width: var(--ancho-final);
    height: var(--alto-final);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 7mm 8mm 6mm;
  }

  /* Franja de marca superior — sale al sangrado, por eso está en .pieza */
  .franja {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6mm;
    display: flex;
  }
  .franja span { flex: 1; }
  .franja .a { background: var(--azul); }
  .franja .b { background: var(--amarillo); }
  .franja .c { background: var(--rojo); }

  .headline {
    font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
    font-size: 8.4mm;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--azul);
    margin-top: 3mm;
  }

  .sub {
    font-size: 4.6mm;
    line-height: 1.25;
    color: var(--tinta);
    margin-top: 2.6mm;
    max-width: 74mm;
  }
  .sub strong { color: var(--rojo); }

  /* El QR siempre sobre blanco puro, nunca sobre color. */
  .qr-card {
    margin-top: 4.5mm;
    padding: 3mm;
    background: #FFFFFF;
    border: 0.5mm solid var(--amarillo);
    border-radius: 2mm;
    line-height: 0;
  }
  .qr-card svg { display: block; width: 40mm; height: 40mm; }

  .accion {
    font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
    font-size: 4.4mm;
    line-height: 1.15;
    color: var(--tinta);
    margin-top: 4mm;
  }

  .detalle {
    font-size: 3.5mm;
    line-height: 1.35;
    color: var(--gris);
    margin-top: 1.8mm;
    max-width: 72mm;
  }

  .pie {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5mm;
  }

  /* PLACEHOLDER — reemplazar por <img src="logo.svg" style="height:18mm"> */
  .logo-slot {
    height: 18mm;
    width: 52mm;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0.4mm dashed #B9B9B9;
    border-radius: 1mm;
    color: #9A9A9A;
    font-size: 2.6mm;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .direccion {
    font-size: 2.9mm;
    color: var(--gris);
    letter-spacing: 0.01em;
  }

  /* Marcas de corte, fuera del área final */
  .marcas span {
    position: absolute;
    background: #000;
  }
  .marcas .h { width: 2.2mm; height: 0.18mm; }
  .marcas .v { width: 0.18mm; height: 2.2mm; }
</style>
</head>
