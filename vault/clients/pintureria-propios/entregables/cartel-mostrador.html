<head>
<meta charset="utf-8">
<title>Propios — cartel de mostrador (A6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  CARTEL DE MOSTRADOR — Propios, Pinturería y Ferretería
  A6 vertical: 100 x 150 mm + 3 mm de sangrado por lado = 106 x 156 mm.

  EXPORTAR EL PDF DE IMPRENTA:
    Chrome -> Imprimir -> Destino "Guardar como PDF"
    -> Márgenes: Ninguno
    -> Tamaño: Personalizado 106 x 156 mm
    -> Gráficos de fondo: ACTIVADO   <- si no, salen los colores en blanco
  Sale vectorial, con las fuentes embebidas. Necesita internet al imprimir
  (las fuentes vienen de Google Fonts).

  MATERIAL: cartulina 300 g MATE, o acrílico portafolio A6.
  Mate, no brillante: el brillo refleja bajo luz de tubo y arruina el escaneo.

  EL QR NO SE TOCA:
  · Va a 40 mm de lado. A menos de 30 mm deja de escanear a la distancia real
    de un mostrador (la regla es distancia ≈ 10x el lado del QR).
  · Los 4 módulos de blanco alrededor son la quiet zone. Si la imprenta recorta
    ese margen, el QR deja de leerse. Es el error de imprenta más común.
  · Nunca invertirlo (claro sobre oscuro): muchos lectores no lo levantan.

  El logo va embebido en base64 a propósito, para que el archivo no dependa de
  ninguna carpeta cuando se lo mande a la imprenta.
-->
<style>
  :root {
    --azul:     #123A8F;
    --amarillo: #FFD100;
    --rojo:     #D81E05;
    --tinta:    #14161A;
    --gris:     #5A5F6B;
    --crema:    #FDFBF7;

    --ancho-final: 100mm;
    --alto-final:  150mm;
    --sangrado:    3mm;
  }

  @page { size: 106mm 156mm; margin: 0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #E8E8E8;
    font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .pieza {
    position: relative;
    width: calc(var(--ancho-final) + var(--sangrado) * 2);
    height: calc(var(--alto-final) + var(--sangrado) * 2);
    margin: 10mm auto;
    background: var(--crema);
    overflow: hidden;
  }

  @media print {
    html, body { background: #FFFFFF; }
    .pieza { margin: 0; }
  }

  /* franja de marca — sale al sangrado, por eso vive en .pieza */
  .franja { position: absolute; top: 0; left: 0; right: 0; height: 6mm; display: flex; }
  .franja i { display: block; }
  .franja i:nth-child(1) { flex: 2; background: var(--azul); }
  .franja i:nth-child(2) { flex: 1; background: var(--amarillo); }
  .franja i:nth-child(3) { flex: 1; background: var(--rojo); }

  .contenido {
    position: absolute;
    top: var(--sangrado);
    left: var(--sangrado);
    width: var(--ancho-final);
    height: var(--alto-final);
    padding: 5mm 8mm 4mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* 27 mm de ancho sobre un original de 500 px = 470 dpi */
  .logo { width: 27mm; height: auto; display: block; }

  .headline {
    font-family: "Anybody", "Arial Black", sans-serif;
    font-weight: 900;
    font-stretch: 106%;
    text-transform: uppercase;
    font-size: 6.9mm;
    line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--azul);
    margin-top: 3mm;
  }

  .sub {
    font-size: 4.1mm;
    line-height: 1.25;
    color: var(--tinta);
    margin-top: 2.2mm;
    max-width: 72mm;
  }
  .sub b { font-weight: 700; }

  /* el QR siempre sobre blanco puro, nunca sobre color */
  .qr-card {
    margin-top: 3.5mm;
    padding: 2.6mm;
    background: #FFFFFF;
    border: 0.6mm solid var(--amarillo);
    border-radius: 2.5mm;
    line-height: 0;
  }
  .qr-card svg { display: block; width: 40mm; height: 40mm; }

  .accion {
    font-family: "Anybody", "Arial Black", sans-serif;
    font-weight: 800;
    font-stretch: 112%;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 3.9mm;
    line-height: 1.15;
    color: var(--tinta);
    margin-top: 2.5mm;
  }

  .detalle {
    font-size: 3.3mm;
    line-height: 1.28;
    color: var(--gris);
    margin-top: 1.4mm;
    max-width: 70mm;
  }

  .pie {
    margin-top: auto;
    padding-top: 2mm;
    border-top: 0.25mm solid #DDD8CC;
    width: 62mm;
    font-size: 2.9mm;
    line-height: 1.35;
    color: var(--gris);
  }
</style>
</head>
