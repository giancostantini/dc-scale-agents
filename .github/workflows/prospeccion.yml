name: Prospección

# Prospector de Llamados (Gerencia de Ventas). Lunes 10:30 UTC = 07:30 UY:
# busca llamados laborales públicos de marketing (web search) y carga los
# candidatos score ≥4 como prospectos en /pipeline. El refresh de digests
# de las 11:15 UTC los mete solo en el contexto del Gerente General y del
# Gerente de Ventas ese mismo lunes.
#
# SOLO CARGA — jamás contacta: redacción vía el botón de mensaje del
# pipeline, envío SIEMPRE humano (regla dura de la Gerencia de Ventas).
#
# Config de búsqueda editable: vault/agents/prospeccion/busquedas.md

on:
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:
    inputs:
      extra_query:
        description: 'Búsqueda extra para este run (opcional, ej. "ecommerce Chile")'
        required: false

jobs:
  prospectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correr prospección
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL o SUPABASE_KEY no están seteados" >&2
            exit 1
          fi
          cat > /tmp/brief.json << BRIEF_EOF
          {"source":"scheduled","extraQuery":"${{ inputs.extra_query || '' }}"}
          BRIEF_EOF
          node scripts/prospeccion/index.js --brief /tmp/brief.json

      # Redacta los primeros contactos de los prospectos nuevos y los deja
      # en la cola de aprobación. NADA se envía acá: el envío lo decide un
      # humano en /pipeline/mensajes. Si algo falla, el job no se rompe —
      # los prospectos ya están cargados, que es lo importante.
      - name: Llenar la cola de mensajes
        env:
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${DASHBOARD_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::DASHBOARD_BASE_URL o CRON_SECRET no seteados — la cola no se llenó."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            response=$(curl -fsS -X POST \
              "${DASHBOARD_BASE_URL}/api/cron/outreach-draft" \
              -H "x-internal-secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}') || {
                echo "::warning::el endpoint de drafts falló (intento $i)"; exit 0; }
            echo "Response: $response"
            configured=$(echo "$response" | jq -r '.configured // false')
            if [ "$configured" = "false" ]; then
              echo "::notice::Cola dormida: $(echo "$response" | jq -r '.detail // "sin detalle"')"
              exit 0
            fi
            remaining=$(echo "$response" | jq -r '.remaining // 0')
            echo "Mensajes redactados en esta tanda: $(echo "$response" | jq -r '.created // 0') · faltan: $remaining"
            [ "$remaining" = "0" ] && break
          done
